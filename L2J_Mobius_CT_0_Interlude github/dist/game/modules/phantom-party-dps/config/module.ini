# Phantom Party DPS module
# Master on/off switch. With False the module does nothing and party phantoms
# fight exactly as the stock party manager plays them. Restart to apply.
Enabled = True

# .dps shows damage, DPS, casts and active time per party member, for the
# current or last fight and for the session. ".dps reset" clears it.
Meter = True

# Fast follow-up: when a DPS member starts a cast, the next skill is picked as
# soon as the cast ends, instead of at the manager's next 1 s tick after a
# 1.6-2.5 s pause. Fighters with nothing ready resume swinging right away.
FastFollowUp = True
# Pause between the end of one cast and the next, plus a random 0..Jitter.
# 1600 / 900 is roughly the stock pace; lower is faster.
CastGapMs = 250
CastGapJitterMs = 250
# A member counts as fighting its target for this long after its last swing or
# cast on it. The follow-up stops once this runs out.
EngagedWindowMs = 1500

# Burn phase: on a mob the party will kill within BurnTtkSeconds, skip DEBUFF,
# CONTROL and OPENER entries so casts go into damage. Never on raids.
BurnPhase = True
BurnTtkSeconds = 5

# Party roles the follow-up and burn phase apply to. TANK is left out on
# purpose (its taunts and threat are the manager's job); add it if you want.
Roles = WARRIOR,DAGGER,ARCHER,MONK,NUKER

# Logs each follow-up cast and each burn switch. Noisy; for testing only.
Debug = False
