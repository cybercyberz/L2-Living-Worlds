# Quest Navigator module
# Master on/off switch. With this False the module does nothing and the server
# is stock. The patched Alt+U window (tools\questnav) then opens nothing when
# you click a quest.
Enabled = True

# Write every quest's start, talk and hunt NPCs to ExportPath two minutes after
# the server starts (spawns load after modules), for debugging. A GM can re-export any time with .questnav export.
ExportOnStartup = True

# Relative to the game server's working directory (game\).
ExportPath = ../tools/questnav/quest_npcs.tsv
