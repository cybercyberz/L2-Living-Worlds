# Phantom Combat module
# When a phantom may cast next, in one place. Master on/off switch: with False
# every phantom fights exactly as the stock engine plays it. Restart to apply.
Enabled = True

# Logs every cooldown, follow-up cast and burn switch. Noisy; testing only.
Debug = False

# ---------------------------------------------------------------------------
# Skill pacing (all phantoms: field hunters, party members, alt companions)
# ---------------------------------------------------------------------------
# A playstyle entry's paceMs in game\data\PhantomPlaystyles.xml is the minimum
# gap between casts of THAT skill; the phantom keeps casting its other skills
# meanwhile. With False the stock engine returns for everyone the party tempo
# below doesn't cover: after a paced skill the phantom casts nothing else
# (except PANIC entries) for paceMs. Party tempo members always keep paceMs as
# a per-skill gap, so a short tempo gap can never erase it.
SkillPacing = True

# ---------------------------------------------------------------------------
# Party tempo (recruited party members in the Roles below)
# ---------------------------------------------------------------------------
# When a member starts a cast, the next skill is picked as soon as the cast
# ends, instead of at the party manager's next 1 s tick after a 1.6-2.5 s
# pause. Fighters with nothing ready resume swinging right away. Only acts on
# the mob the member was already hitting; never on raid bosses or minions.
PartyTempo = True
# Pause between the end of one cast and the next, plus a random 0..Jitter.
# 1600 / 900 is roughly the stock pace; lower is faster.
CastGapMs = 250
CastGapJitterMs = 250
# A member counts as fighting its target for this long after its last swing or
# cast on it. The follow-up stops once this runs out.
EngagedWindowMs = 1500

# Burn phase: on a mob the party will kill within BurnTtkSeconds, skip DEBUFF,
# CONTROL and OPENER entries so casts go into damage. Never on raids.
BurnPhase = True
BurnTtkSeconds = 5

# Party roles the tempo and burn phase apply to. TANK is left out on purpose
# (its taunts and threat are the party manager's job); add it if you want.
Roles = WARRIOR,DAGGER,ARCHER,MONK,NUKER

# ---------------------------------------------------------------------------
# Meter
# ---------------------------------------------------------------------------
# .dps shows damage, DPS, casts and active time per party member, for the
# current or last fight and for the session. ".dps reset" clears it.
Meter = True
