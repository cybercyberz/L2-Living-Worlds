# Role Buffer module
# Master on/off switch. With this False the module does nothing: the Buffer
# button on the Alt+B board opens nothing and .buff isn't recognised.
Enabled = True

# Where buffs.tsv and packages.txt live, relative to the game server's working
# directory (game\). Edit packages.txt, then check it with
# python tools\buffer\build_buffer_data.py
DataPath = modules/role-buffer/data

# How long every buff, dance and song of a package lasts, in seconds.
# 0 keeps each skill's own time (buffs 20 min, dances/songs 2 min, the
# all-in-one chants and prophecies 5 min).
BuffDurationSeconds = 3600

# What one package costs (the pet's package is included). 0 = free.
PricePerPackage = 0
PriceItemId = 57

# Whether "Also buff my pet/summon" starts On. Each character can switch it on
# the Buffer page; their choice is remembered.
BuffPetDefault = True

# Allow buffing while in combat (hit or hitting in the last few seconds).
AllowInCombat = False

# The shortest time between two packages, in milliseconds. A click inside it
# gets "one moment" instead of being lost.
ApplyCooldownMs = 1000

# Log every Buffer click and result to the server console.
Debug = False
