# Phantom Skill Pacing module
# Master on/off switch. With this True, a playstyle entry's paceMs in
# game\data\PhantomPlaystyles.xml is the minimum gap between casts of THAT
# skill; the phantom keeps casting its other skills meanwhile. With False the
# engine's stock behavior returns: after a paced skill the phantom casts
# nothing else (except PANIC entries) for paceMs. Restart to apply.
Enabled = True

# Logs every per-skill cooldown the module applies, and each playstyle reload
# it re-syncs to. Noisy; for testing only.
Debug = False
