# Adventurer's Guide module
# Master on/off switch. With this False the module does nothing: the Guide
# button on the Alt+B board opens nothing and .guide isn't recognised.
Enabled = True

# Board setup, so a plain copy of this folder works on any install:
# EnableCustomBoard turns on the custom Alt+B board (the one with the left
# menu) even when game\config\Custom\CommunityBoard.ini has
# CustomCommunityBoard = False, as the stock pack does.
# AddMenuButton adds a Guide button to the top of that menu
# (data\html\CommunityBoard\Custom\navigation.html) once, if it isn't there.
EnableCustomBoard = True
AddMenuButton = True

# Where the generated tables and tips.txt live, relative to the game server's
# working directory (game\). Rebuild the tables with tools\guide\build_guide_data.py.
DataPath = modules/adventurer-guide/data

# "Teleport near" buttons: to the gatekeeper destination nearest the quest NPC,
# hunting spot or town. The fee is that destination's cheapest gatekeeper fee
# times TeleportFeeMultiplier, and free up to FreeTeleportMaxLevel.
TeleportEnabled = True
TeleportFeeMultiplier = 1.0
FreeTeleportMaxLevel = 20

# "Where to hunt" lists monsters from (your level - HuntLevelBelow) to
# (your level + HuntLevelAbove).
HuntLevelBelow = 3
HuntLevelAbove = 4

# At login, characters up to this level get a one-line reminder that the guide
# exists. 0 turns it off.
LoginHintMaxLevel = 40

# On level up, say how many new quests opened, and when a class change or a
# new gear grade becomes available.
LevelUpHints = True
